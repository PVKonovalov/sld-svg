<?xml version="1.0"?>
<!-- Hand-authored sample SLD, IEEE 9-bus test system (see Sample-test-system-the-IEEE-9-bus-grid.png).
     Follows this project's SVG conventions: dark background (#12161d, matching
     internal/slddoc/render.go's defaultBackground), <g id data-type data-name> grouped elements
     with integer id="..." (per docs/SLD_SVG_ELEMENTS.md's attribute reference), data-voltage-colored
     equipment, and plain <text> labels in Arial. Every element's data-type is a real xsde2svg catalog
     code: 24 (Busbar), 173 (Generator), 22 (Overhead line), 28 (Object link, used for load — the
     catalog has no dedicated load/consumer shape), 7 (Point, drawn as bare <circle data-type="7">
     with no wrapping <g>, matching examples/sld/PS_35kV_Krasnaya.svg's own convention: fill = the
     background color, stroke/data-voltage = the connected wire's color), 5 (Text — every equipment
     name/bus name/MW-value caption, likewise a bare <text data-type="5">, matching the source
     corpus's own convention of pulling captions out as standalone elements rather than nesting them
     under the equipment they label). Point and Text are each grouped in their own single block
     ("Point:7", "Text:5", in that order) placed after every other element, so dots and captions both
     draw on top of the whole diagram. A shape's own baked-in pictogram text (the generator's "P V",
     the line box's "π π") stays inside that shape's group, since it's part of the symbol's drawing,
     not a freestanding caption — matching how the FPI symbol's own "FPI" text is baked into its
     symbols.xml template rather than extracted as a Label. Geometry (the generator "P V" circle,
     load triangle, pi-network line box) is drawn from scratch, since none of these codes' real
     xsde2svg rendering matches this diagram's chosen look. -->
